<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serene Drives | Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            overflow: hidden;
            background: #000;
            color: #fff;
        }
        
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        #ui-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        .dashboard {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            padding: 20px 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 30px;
            align-items: center;
        }
        
        .speedometer {
            text-align: center;
        }
        
        .speed-value {
            font-size: 3em;
            font-weight: 300;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(100, 200, 255, 0.7);
        }
        
        .speed-unit {
            font-size: 1.2em;
            opacity: 0.7;
        }
        
        .controls-hint {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9em;
            line-height: 1.6;
        }
        
        .title {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.5em;
            font-weight: 300;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(100, 200, 255, 0.7);
            opacity: 0.9;
        }
        
        .environment-controls {
            position: absolute;
            top: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: all;
        }
        
        .control-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .control-item label {
            width: 80px;
            opacity: 0.8;
        }
        
        .control-item input {
            pointer-events: all;
        }
        
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 1s ease-out;
        }
        
        .progress-bar {
            width: 300px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            margin-top: 20px;
            border-radius: 2px;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00aaff, #00ffaa);
            transition: width 0.5s ease;
        }
        
        .message {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5em;
            text-align: center;
            opacity: 0.8;
            max-width: 600px;
            line-height: 1.5;
        }
        
        .main-nav {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .nav-item {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: all;
            transition: all 0.3s ease;
        }
        
        .nav-item:hover {
            background: rgba(50, 100, 150, 0.6);
            transform: translateY(-2px);
        }
        
        /* Notification system */
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 200, 255, 0.3);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        
        .notification.show {
            opacity: 1;
        }
        
        /* Level info display */
        .level-info {
            position: absolute;
            top: 100px;
            left: 30px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9em;
            line-height: 1.6;
            max-width: 250px;
        }
        
        .level-info h3 {
            color: #64c8ff;
            margin-bottom: 10px;
        }
        
        /* Camera info */
        .camera-info {
            position: absolute;
            top: 180px;
            left: 30px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="ui-overlay">
        <h1 class="title">Serene Drives</h1>
        
        <div class="dashboard">
            <div class="speedometer">
                <div class="speed-value">00</div>
                <div class="speed-unit">km/h</div>
            </div>
        </div>
        
        <div class="controls-hint">
            <div>W/A/S/D - Drive</div>
            <div>R - Reset Car</div>
            <div>Space - Handbrake</div>
            <div>C - Change Camera</div>
            <div>M - Menu</div>
        </div>
        
        <div class="environment-controls">
            <div class="control-item">
                <label for="time-of-day">Time:</label>
                <input type="range" id="time-of-day" min="0" max="100" value="30">
            </div>
            <div class="control-item">
                <label for="fog-density">Fog:</label>
                <input type="range" id="fog-density" min="0" max="100" value="20">
            </div>
            <div class="control-item">
                <label for="weather">Weather:</label>
                <input type="range" id="weather" min="0" max="100" value="0">
            </div>
        </div>
        
        <div class="level-info" id="levelInfo">
            <h3 id="currentLevel">Sunset Valley</h3>
            <p id="levelDescription">Rolling hills and winding roads bathed in the golden light of sunset.</p>
        </div>
        
        <div class="camera-info" id="cameraInfo">
            Camera: Follow View
        </div>
        
        <nav class="main-nav">
            <a href="/" class="nav-item">Menu</a>
            <a href="/levels" class="nav-item">Levels</a>
            <a href="/garage" class="nav-item">Garage</a>
            <a href="/settings" class="nav-item">Settings</a>
        </nav>
    </div>
    
    <div class="loading-screen">
        <div class="logo">SERENE DRIVES</div>
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
    </div>
    
    <div class="notification" id="notification">Settings Applied</div>

    <script>
        // Get level from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const levelParam = urlParams.get('level') || 'sunset-valley';
        
        // Level data
        const levelData = {
            'sunset-valley': {
                name: 'Sunset Valley',
                description: 'Rolling hills and winding roads bathed in the golden light of sunset.',
                groundColor: 0x2c4c2c,
                fogColor: 0x0c1e3e
            },
            'mountain-pass': {
                name: 'Mountain Pass',
                description: 'Steep climbs and breathtaking views from high mountain roads.',
                groundColor: 0x1c3c1c,
                fogColor: 0x102030
            },
            'lakeside-cruise': {
                name: 'Lakeside Cruise',
                description: 'Peaceful roads following the shoreline of a crystal-clear lake.',
                groundColor: 0x2c4c2c,
                fogColor: 0x1a5c7a
            },
            'autumn-forest': {
                name: 'Autumn Forest',
                description: 'Colorful fall foliage lines the roads through this dense woodland.',
                groundColor: 0x4c2c2c,
                fogColor: 0x553311
            },
            'coastal-highway': {
                name: 'Coastal Highway',
                description: 'Ocean views and gentle sea breezes on this coastal driving route.',
                groundColor: 0x2c3c4c,
                fogColor: 0x1a3c5c
            },
            'night-drive': {
                name: 'Night Drive',
                description: 'City lights and moonlit roads for a completely different experience.',
                groundColor: 0x1c1c2c,
                fogColor: 0x0c0c1c
            }
        };
        
        // Set level info
        document.getElementById('currentLevel').textContent = levelData[levelParam].name;
        document.getElementById('levelDescription').textContent = levelData[levelParam].description;

        // Main Three.js variables
        let scene, camera, renderer, controls;
        let car, environment, physics, ui;
        let clock = new THREE.Clock();
        
        // Game state
        const gameState = {
            speed: 0,
            loading: true,
            loadingProgress: 0,
            cameraMode: 0, // 0: follow, 1: first-person, 2: orbital, 3: rear-view
            timeOfDay: 0.3,
            fogDensity: 0.02,
            weather: 0,
            isDriving: false,
            currentLevel: levelParam
        };
        
        // Camera mode names for UI
        const cameraModeNames = [
            "Follow View",
            "First-Person View", 
            "Orbital View",
            "Rear View"
        ];
        
        // Initialize the game
        function init() {
            // Create scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x071c36);
            scene.fog = new THREE.FogExp2(levelData[gameState.currentLevel].fogColor, gameState.fogDensity);
            
            // Create camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);
            
            // Create renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1;
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            // Initialize modules
            createEnvironment();
            createCar();
            setupPhysics();
            setupUI();
            
            // Add lights
            const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xfffaf0, 0.8);
            directionalLight.position.set(50, 50, 50);
            directionalLight.castShadow = true;
            directionalLight.shadow.camera.far = 200;
            directionalLight.shadow.camera.near = 0.5;
            directionalLight.shadow.camera.left = -50;
            directionalLight.shadow.camera.right = 50;
            directionalLight.shadow.camera.top = 50;
            directionalLight.shadow.camera.bottom = -50;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);
            
            // Add hemisphere light for more natural ambient
            const hemisphereLight = new THREE.HemisphereLight(0xffffbb, 0x080820, 0.5);
            scene.add(hemisphereLight);
            
            // Add orbit controls for debugging
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enabled = false;
            
            // Handle window resize
            window.addEventListener('resize', onWindowResize);
            
            // Add keyboard controls
            document.addEventListener('keydown', handleKeyDown);
            document.addEventListener('keyup', handleKeyUp);
            
            // Add menu key
            document.addEventListener('keydown', (e) => {
                if (e.key === 'm' || e.key === 'M') {
                    window.location.href = '/';
                }
            });
            
            // Setup UI controls
            document.getElementById('time-of-day').addEventListener('input', e => {
                gameState.timeOfDay = e.target.value / 100;
                updateEnvironment();
            });
            
            document.getElementById('fog-density').addEventListener('input', e => {
                gameState.fogDensity = e.target.value / 1000;
                scene.fog.density = gameState.fogDensity;
            });
            
            document.getElementById('weather').addEventListener('input', e => {
                gameState.weather = e.target.value / 100;
                updateWeather();
            });
            
            // Start the animation loop
            animate();
            
            // Simulate loading process
            simulateLoading();
        }
        
        function createEnvironment() {
            environment = new THREE.Group();
            
            // Create ground with level-specific color
            const groundGeometry = new THREE.PlaneGeometry(500, 500);
            const groundMaterial = new THREE.MeshStandardMaterial({ 
                color: levelData[gameState.currentLevel].groundColor,
                roughness: 0.8,
                metalness: 0.2
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            environment.add(ground);
            
            // Add some hills
            const hillGeometry = new THREE.SphereGeometry(80, 32, 32);
            const hillMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x1c3c1c,
                roughness: 0.9,
                metalness: 0.1
            });

            for (let i = 0; i < 5; i++) {
                const hill = new THREE.Mesh(hillGeometry, hillMaterial);
                hill.position.set(
                    Math.random() * 300 - 150,
                    -30,
                    Math.random() * 300 - 150
                );
                hill.scale.set(
                    1,
                    Math.random() * 0.5 + 0.3,
                    1
                );
                hill.castShadow = true;
                hill.receiveShadow = true;
                environment.add(hill);
            }

            // Add trees
            const treeTrunkGeometry = new THREE.CylinderGeometry(0.5, 1, 5, 8);
            const treeTrunkMaterial = new THREE.MeshStandardMaterial({ color: 0x4a3520 });
            const treeCrownGeometry = new THREE.SphereGeometry(4, 8, 6);
            const treeCrownMaterial = new THREE.MeshStandardMaterial({ color: 0x2c5c2c });

            for (let i = 0; i < 100; i++) {
                const tree = new THREE.Group();
                
                const trunk = new THREE.Mesh(treeTrunkGeometry, treeTrunkMaterial);
                trunk.position.y = 2.5;
                trunk.castShadow = true;
                trunk.receiveShadow = true;
                
                const crown = new THREE.Mesh(treeCrownGeometry, treeCrownMaterial);
                crown.position.y = 6;
                crown.castShadow = true;
                crown.receiveShadow = true;
                
                tree.add(trunk, crown);
                
                tree.position.set(
                    Math.random() * 400 - 200,
                    0,
                    Math.random() * 400 - 200
                );
                
                environment.add(tree);
            }

            // Add a lake
            const lakeGeometry = new THREE.CircleGeometry(30, 32);
            const lakeMaterial = new THREE.MeshStandardMaterial({
                color: 0x1a5c7a,
                roughness: 0.1,
                metalness: 0.9
            });
            const lake = new THREE.Mesh(lakeGeometry, lakeMaterial);
            lake.position.set(50, 0.1, -80);
            lake.rotation.x = -Math.PI / 2;
            environment.add(lake);
            
            scene.add(environment);
        }
        
        function createCar() {
            car = new THREE.Group();
            
            // Car body - using BoxGeometry but with rounded edges via material
            const bodyGeometry = new THREE.BoxGeometry(3, 1, 6);
            const bodyMaterial = new THREE.MeshPhongMaterial({ 
                color: 0x3568d4,
                shininess: 100,
                specular: 0x222222
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 0.8; // Lowered to fix floating issue
            body.castShadow = true;
            body.receiveShadow = true;
            car.add(body);

            // Car roof - using BoxGeometry but positioned to create a car-like shape
            const roofGeometry = new THREE.BoxGeometry(2.5, 1, 2.5);
            const roofMaterial = new THREE.MeshPhongMaterial({ 
                color: 0x3568d4,
                shininess: 100,
                specular: 0x222222
            });
            const roof = new THREE.Mesh(roofGeometry, roofMaterial);
            roof.position.y = 1.8; // Adjusted for lower body
            roof.position.z = -0.5;
            roof.castShadow = true;
            roof.receiveShadow = true;
            car.add(roof);

            // Wheels - properly sized and positioned to touch ground
            const wheelGeometry = new THREE.CylinderGeometry(0.5, 0.5, 0.8, 16);
            const wheelMaterial = new THREE.MeshPhongMaterial({ 
                color: 0x222222,
                shininess: 30
            });

            for (let i = 0; i < 4; i++) {
                const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
                wheel.rotation.z = Math.PI / 2;
                
                if (i % 2 === 0) {
                    wheel.position.x = 1.4;
                } else {
                    wheel.position.x = -1.4;
                }
                
                if (i < 2) {
                    wheel.position.z = 2;
                } else {
                    wheel.position.z = -2;
                }
                
                wheel.position.y = 0.4; // Lowered to properly touch ground
                wheel.castShadow = true;
                car.add(wheel);
                if (!car.wheels) car.wheels = [];
                car.wheels.push(wheel);
            }

            // Windshield
            const windshieldGeometry = new THREE.PlaneGeometry(2, 1);
            const windshieldMaterial = new THREE.MeshPhongMaterial({
                color: 0xa0d0ff,
                transparent: true,
                opacity: 0.6,
                specular: 0xffffff,
                shininess: 100
            });
            const windshield = new THREE.Mesh(windshieldGeometry, windshieldMaterial);
            windshield.position.y = 1.5;
            windshield.position.z = 0.5;
            windshield.rotation.x = Math.PI / 6;
            car.add(windshield);

            // Headlights
            const headlightGeometry = new THREE.SphereGeometry(0.25, 16, 16);
            const headlightMaterial = new THREE.MeshBasicMaterial({ color: 0xffffcc });

            const leftHeadlight = new THREE.Mesh(headlightGeometry, headlightMaterial);
            leftHeadlight.position.set(1.2, 0.6, 2.8);
            car.add(leftHeadlight);

            const rightHeadlight = new THREE.Mesh(headlightGeometry, headlightMaterial);
            rightHeadlight.position.set(-1.2, 0.6, 2.8);
            car.add(rightHeadlight);
            
            // Taillights
            const taillightGeometry = new THREE.SphereGeometry(0.25, 16, 16);
            const taillightMaterial = new THREE.MeshBasicMaterial({ color: 0xff3333 });

            const leftTaillight = new THREE.Mesh(taillightGeometry, taillightMaterial);
            leftTaillight.position.set(1, 0.6, -2.8);
            car.add(leftTaillight);

            const rightTaillight = new THREE.Mesh(taillightGeometry, taillightMaterial);
            rightTaillight.position.set(-1, 0.6, -2.8);
            car.add(rightTaillight);

            // Position the car to properly touch the ground
            car.position.set(0, 0.5, 0); // Lowered to fix floating
            scene.add(car);
        }
        
        function setupPhysics() {
            physics = {
                speed: 0,
                acceleration: 0,
                steering: 0,
                handbrake: false,
                maxSpeed: 0.3,
                accelerationRate: 0.001,
                decelerationRate: 0.002,
                steeringRate: 0.03,
                
                accelerate: function(direction) {
                    this.acceleration = direction;
                },
                
                steer: function(direction) {
                    this.steering = direction;
                },
                
                setHandbrake: function(value) {
                    this.handbrake = value;
                },
                
                update: function(delta) {
                    // Apply acceleration
                    if (this.acceleration !== 0) {
                        this.speed += this.acceleration * this.accelerationRate * delta * 60;
                        
                        // Limit speed
                        if (this.speed > this.maxSpeed) this.speed = this.maxSpeed;
                        if (this.speed < -this.maxSpeed / 2) this.speed = -this.maxSpeed / 2;
                    } else {
                        // Apply deceleration when not accelerating
                        if (this.speed > 0) {
                            this.speed -= this.decelerationRate * delta * 60;
                            if (this.speed < 0) this.speed = 0;
                        } else if (this.speed < 0) {
                            this.speed += this.decelerationRate * delta * 60;
                            if (this.speed > 0) this.speed = 0;
                        }
                    }

                    // Apply handbrake deceleration
                    if (this.handbrake && this.speed !== 0) {
                        if (this.speed > 0) {
                            this.speed -= this.decelerationRate * 3 * delta * 60;
                            if (this.speed < 0) this.speed = 0;
                        } else {
                            this.speed += this.decelerationRate * 3 * delta * 60;
                            if (this.speed > 0) this.speed = 0;
                        }
                    }

                    // Move car
                    car.translateZ(this.speed * delta * 60);

                    // Apply steering if moving
                    if (Math.abs(this.speed) > 0.01) {
                        car.rotation.y += this.steering * this.steeringRate * (this.speed / this.maxSpeed) * delta * 60;
                    }

                    // Update game state
                    gameState.speed = this.speed * 100;
                },
                
                reset: function() {
                    this.speed = 0;
                    this.acceleration = 0;
                    this.steering = 0;
                    this.handbrake = false;
                    car.position.set(0, 0.5, 0);
                    car.rotation.set(0, 0, 0);
                }
            };
        }
        
        function setupUI() {
            ui = {
                update: function() {
                    // Update speedometer
                    document.querySelector('.speed-value').textContent = Math.abs(Math.round(gameState.speed * 3.6));
                    
                    // Update camera info
                    document.getElementById('cameraInfo').textContent = `Camera: ${cameraModeNames[gameState.cameraMode]}`;
                }
            };
        }
        
        function updateEnvironment() {
            // Update lighting based on time of day
            const directionalLight = scene.children.find(child => child instanceof THREE.DirectionalLight);
            const ambientLight = scene.children.find(child => child instanceof THREE.AmbientLight);
            const hemisphereLight = scene.children.find(child => child instanceof THREE.HemisphereLight);

            if (directionalLight) {
                directionalLight.intensity = 0.3 + gameState.timeOfDay * 0.7;
                
                // Change light color based on time of day
                if (gameState.timeOfDay < 0.3) {
                    // Dawn/dusk - orange tint
                    directionalLight.color.setHSL(0.09, 0.9, 0.6);
                } else if (gameState.timeOfDay > 0.7) {
                    // Midday - white light
                    directionalLight.color.setHSL(0.1, 0.2, 0.9);
                } else {
                    // Day - yellowish white
                    directionalLight.color.setHSL(0.12, 0.5, 0.8);
                }
            }

            if (ambientLight) {
                ambientLight.intensity = 0.1 + gameState.timeOfDay * 0.4;
            }

            if (hemisphereLight) {
                hemisphereLight.intensity = 0.3 + gameState.timeOfDay * 0.5;
            }

            // Update sky color
            if (gameState.timeOfDay < 0.3) {
                // Night to dawn
                scene.background = new THREE.Color(0x071c36);
                scene.fog.color = new THREE.Color(0x0c1e3e);
            } else if (gameState.timeOfDay < 0.6) {
                // Day
                scene.background = new THREE.Color(0x87ceeb);
                scene.fog.color = new THREE.Color(0x87ceeb);
            } else {
                // Dusk to night
                scene.background = new THREE.Color(0x364982);
                scene.fog.color = new THREE.Color(0x364982);
            }
        }
        
        function updateWeather() {
            // Placeholder for weather effects
            console.log("Weather updated to:", gameState.weather);
            
            // Show notification
            showNotification("Weather effects coming in next update!");
        }
        
        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
        
        function handleKeyDown(event) {
            switch(event.key) {
                case 'w':
                case 'W':
                    physics.accelerate(1);
                    break;
                case 's':
                case 'S':
                    physics.accelerate(-1);
                    break;
                case 'a':
                case 'A':
                    physics.steer(-1);
                    break;
                case 'd':
                case 'D':
                    physics.steer(1);
                    break;
                case ' ':
                    physics.setHandbrake(true);
                    break;
                case 'c':
                case 'C':
                    gameState.cameraMode = (gameState.cameraMode + 1) % 4;
                    controls.enabled = (gameState.cameraMode === 2);
                    break;
                case 'r':
                case 'R':
                    physics.reset();
                    break;
            }
        }

        function handleKeyUp(event) {
            switch(event.key) {
                case 'w':
                case 'W':
                case 's':
                case 'S':
                    physics.accelerate(0);
                    break;
                case 'a':
                case 'A':
                case 'd':
                case 'D':
                    physics.steer(0);
                    break;
                case ' ':
                    physics.setHandbrake(false);
                    break;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function simulateLoading() {
            const interval = setInterval(() => {
                gameState.loadingProgress += Math.random() * 10;
                document.getElementById('progress').style.width = `${gameState.loadingProgress}%`;
                
                if (gameState.loadingProgress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        document.querySelector('.loading-screen').style.opacity = 0;
                        setTimeout(() => {
                            gameState.loading = false;
                            document.querySelector('.loading-screen').style.display = 'none';
                        }, 1000);
                    }, 500);
                }
            }, 200);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            
            if (!gameState.loading) {
                // Update physics
                physics.update(delta);
                
                // Update car visuals (wheel rotation)
                if (car.wheels) {
                    const rotationSpeed = physics.speed * 5;
                    car.wheels.forEach(wheel => {
                        wheel.rotation.x += rotationSpeed * delta;
                    });
                }
                
                // Update camera position based on mode
                updateCamera(delta);
                
                // Update UI
                ui.update();
            }
            
            renderer.render(scene, camera);
        }

        function updateCamera(delta) {
            const targetPosition = new THREE.Vector3();
            car.getWorldPosition(targetPosition);
            
            switch(gameState.cameraMode) {
                case 0: // Follow camera
                    const cameraOffset = new THREE.Vector3(
                        Math.sin(car.rotation.y) * 8,
                        3,
                        Math.cos(car.rotation.y) * 8
                    );
                    
                    camera.position.lerp(targetPosition.clone().add(cameraOffset), 0.1);
                    camera.lookAt(targetPosition.x, targetPosition.y + 1, targetPosition.z);
                    break;
                    
                case 1: // First-person camera
                    const fpPosition = new THREE.Vector3();
                    car.getWorldPosition(fpPosition);
                    fpPosition.y += 1.2;
                    fpPosition.z += 0.3;
                    camera.position.lerp(fpPosition, 0.2);
                    camera.rotation.y = car.rotation.y;
                    break;
                    
                case 2: // Orbital camera (controlled by OrbitControls)
                    // Controls are handled automatically by OrbitControls
                    break;
                    
                case 3: // Rear view camera
                    const rearOffset = new THREE.Vector3(
                        Math.sin(car.rotation.y) * -6,
                        2.5,
                        Math.cos(car.rotation.y) * -6
                    );
                    
                    camera.position.lerp(targetPosition.clone().add(rearOffset), 0.1);
                    camera.lookAt(targetPosition.x, targetPosition.y + 1, targetPosition.z);
                    break;
            }
        }

        // Start the game when the document is loaded
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
